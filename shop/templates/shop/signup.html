<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up | E-Commerce</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(60, 100, 255, 0.15),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(120, 70, 255, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #030712,
                    #071126,
                    #0b1430
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;

            padding: 20px 12px;
        }


        /* Main Wrapper */

        .signup-wrapper {

            width: 100%;
            max-width: 430px;

            margin: auto;
        }


        /* Signup Card */

        .signup-card {

            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 29, 60, 0.98),
                    rgba(7, 14, 32, 0.98)
                );

            border: 1px solid rgba(120, 150, 255, 0.15);

            border-radius: 24px;

            padding: 32px 32px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                0 0 35px rgba(60, 100, 255, 0.08);

        }


        /* Logo */

        .signup-logo {

            width: 60px;
            height: 60px;

            margin: 0 auto 15px;

            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #4169ff,
                    #784cff
                );

            box-shadow:
                0 10px 25px rgba(65, 105, 255, 0.30);

            font-size: 26px;
        }


        /* Heading */

        .signup-title {

            text-align: center;

            font-size: 28px;

            font-weight: 800;

            margin: 0;

            color: #ffffff;
        }


        .signup-subtitle {

            text-align: center;

            color: #8f9bb8;

            font-size: 14px;

            margin: 7px 0 24px;
        }


        /* Labels */

        .form-label {

            display: block;

            color: #c7d0e6;

            font-weight: 600;

            font-size: 14px;

            margin-bottom: 7px;
        }


        /* Input Wrapper */

        .input-wrapper {

            position: relative;

            width: 100%;

            margin-bottom: 16px;
        }


        /* Input Icon */

        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #7185c5;

            font-size: 17px;

            pointer-events: none;

            z-index: 2;
        }


        /* Input */

        .form-control {

            width: 100%;

            height: 49px;

            padding: 0 15px 0 44px;

            border-radius: 12px;

            border: 1px solid rgba(130, 150, 200, 0.16);

            background: rgba(4, 10, 25, 0.80);

            color: #ffffff;

            font-size: 14px;

            box-shadow: none;

            transition: 0.3s ease;
        }


        .form-control::placeholder {

            color: #66728e;
        }


        .form-control:focus {

            background: rgba(5, 12, 30, 0.95);

            color: #ffffff;

            border-color: #557cff;

            box-shadow:
                0 0 0 3px rgba(85, 124, 255, 0.12);

            outline: none;
        }


        /* Error */

        .alert-danger {

            background: rgba(220, 53, 69, 0.10);

            border: 1px solid rgba(220, 53, 69, 0.25);

            color: #ff9ca5;

            border-radius: 11px;

            font-size: 13px;

            padding: 11px 13px;

            margin-bottom: 18px;
        }


        /* Signup Button */

        .signup-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #4d7cff,
                    #8050ff
                );

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            box-shadow:
                0 10px 25px rgba(77, 124, 255, 0.25);

            transition: 0.3s ease;

            margin-top: 4px;
        }


        .signup-btn:hover {

            transform: translateY(-2px);

            color: #ffffff;

            box-shadow:
                0 15px 30px rgba(77, 124, 255, 0.35);
        }


        /* Login */

        .login-text {

            text-align: center;

            color: #8793ad;

            font-size: 13px;

            margin: 21px 0 0;
        }


        .login-text a {

            color: #6e94ff;

            font-weight: 700;

            text-decoration: none;

            margin-left: 3px;

        }


        .login-text a:hover {

            color: #9a7cff;

            text-decoration: underline;
        }


        /* Security */

        .secure-text {

            text-align: center;

            color: #59657f;

            font-size: 11px;

            margin-top: 17px;
        }


        .secure-text i {

            color: #5f82e8;

            margin-right: 4px;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 576px) {

            body {

                padding: 15px 10px;
            }


            .signup-wrapper {

                width: 100%;

                max-width: 100%;
            }


            .signup-card {

                padding: 27px 20px;

                border-radius: 20px;
            }


            .signup-logo {

                width: 55px;
                height: 55px;

                font-size: 24px;

                border-radius: 15px;

                margin-bottom: 13px;
            }


            .signup-title {

                font-size: 24px;
            }


            .signup-subtitle {

                font-size: 13px;

                margin-bottom: 22px;
            }


            .form-label {

                font-size: 13px;
            }


            .form-control {

                height: 47px;

                font-size: 14px;

                padding-left: 42px;
            }


            .signup-btn {

                height: 48px;

                font-size: 14px;
            }


            .login-text {

                font-size: 12.5px;
            }

        }


        /* ==========================
           VERY SMALL PHONES
        ========================== */

        @media (max-width: 360px) {

            body {

                padding: 10px 8px;
            }


            .signup-card {

                padding: 23px 16px;

                border-radius: 18px;
            }


            .signup-logo {

                width: 52px;
                height: 52px;

                font-size: 22px;
            }


            .signup-title {

                font-size: 22px;
            }


            .signup-subtitle {

                font-size: 12px;

                margin-bottom: 19px;
            }


            .form-label {

                font-size: 12px;
            }


            .form-control {

                height: 45px;

                font-size: 13px;

                padding-left: 40px;
            }


            .signup-btn {

                height: 46px;

                font-size: 14px;
            }


            .login-text {

                font-size: 12px;
            }


            .secure-text {

                font-size: 10px;

                margin-top: 15px;
            }

        }

    </style>

</head>


<body>


<div class="signup-wrapper">

    <div class="signup-card">


        <!-- Logo -->

        <div class="signup-logo">

            <i class="bi bi-person-plus"></i>

        </div>


        <!-- Heading -->

        <h1 class="signup-title">

            Create Account

        </h1>


        <p class="signup-subtitle">

            Join us and start shopping today

        </p>


        <!-- Error -->

        {% if error %}

        <div class="alert alert-danger">

            <i class="bi bi-exclamation-circle me-2"></i>

            {{ error }}

        </div>

        {% endif %}


        <!-- Signup Form -->

        <form method="POST">

            {% csrf_token %}


            <!-- Username -->

            <div>

                <label class="form-label">

                    Username

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-person input-icon"></i>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- Email -->

            <div>

                <label class="form-label">

                    Email

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-envelope input-icon"></i>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div>

                <label class="form-label">

                    Password

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-lock input-icon"></i>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>

            </div>


            <!-- Signup Button -->

            <button type="submit" class="signup-btn">

                <i class="bi bi-person-plus me-2"></i>

                Create Account

            </button>


        </form>


        <!-- Login -->

        <p class="login-text">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>


        <!-- Security -->

        <div class="secure-text">

            <i class="bi bi-shield-check"></i>

            Your information is securely protected

        </div>


    </div>

</div>


</body>

</html>
